<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#FFFDF9" />
      <feStop offset="100%" stop-color="#FBF7EC" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#FEF08A" />
      <feStop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Border & Grid Texture Accent -->
  <rect x="24" y="24" width="1152" height="582" rx="36" fill="none" stroke="#E7DECB" stroke-width="4" stroke-dasharray="16,8"/>

  <!-- Washi Tape Accents -->
  <rect x="80" y="12" width="160" height="28" rx="4" fill="#F43F5E" opacity="0.85" transform="rotate(-3 160 26)"/>
  <rect x="960" y="12" width="160" height="28" rx="4" fill="#FDE047" opacity="0.85" transform="rotate(3 1040 26)"/>

  <!-- Main Content Container -->
  <g transform="translate(100, 90)">
    
    <!-- Top Tagline Badge -->
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <text x="24" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#92400E" letter-spacing="1.5">
      ⚖️ PORTAL TRANSPARANSI PERKARA PUBLIK
    </text>

    <!-- Main App Title -->
    <text x="0" y="130" font-family="'Baloo 2', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="76" fill="#1E293B">
      LIGA KORUPSI <tspan fill="#DC2626">INDONESIA</tspan>
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="24" fill="#57534E">
      Klasemen Liga • Peta Choropleth 38 Provinsi • Analitik Sektor &amp; Korporasi
    </text>

    <!-- Feature Cards Row -->
    <g transform="translate(0, 240)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="310" height="150" rx="20" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="20" y="20" width="48" height="48" rx="14" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>
      <text x="32" y="53" font-size="26">🏆</text>
      <text x="82" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#1E293B">Klasemen Liga</text>
      <text x="82" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">Pejabat &amp; Partai Politik</text>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#57534E">Filter era kepresidenan &amp; ekspor CSV resmi.</text>

      <!-- Card 2 -->
      <rect x="340" y="0" width="310" height="150" rx="20" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="360" y="20" width="48" height="48" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="372" y="53" font-size="26">🗺️</text>
      <text x="422" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#1E293B">Peta Spasial 38 Prov</text>
      <text x="422" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">Sebaran Geografis Kerugian</text>
      <text x="360" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#57534E">Gradasi choropleth &amp; rincian perkara daerah.</text>

      <!-- Card 3 -->
      <rect x="680" y="0" width="310" height="150" rx="20" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="700" y="20" width="48" height="48" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
      <text x="712" y="53" font-size="26">🛡️</text>
      <text x="762" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#1E293B">Praduga Tak Bersalah</text>
      <text x="762" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748B">Kepatuhan Hukum Ketat</text>
      <text x="700" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#57534E">Wajib sumber direktori putusan MA &amp; KPK.</text>
    </g>

    <!-- Footer URL -->
    <text x="0" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#94A3B8" letter-spacing="1">
      🏛️ LIGA KORUPSI INDONESIA • DOKUMEN PUTUSAN PERADILAN TERBUKA
    </text>
  </g>
</svg>
